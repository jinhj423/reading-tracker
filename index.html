<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>독서 체크리스트</title>
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#000000; --card:#121114; --card2:#1c1a20; --line:#2a2731;
  --text:#f3eef8; --dim:#a69fb2; --faint:#6b6575;
  --amber:#c7a0e6; --amber-d:#c7a0e624; --green:#8fd1a4; --green-d:#8fd1a422; --red:#ef8a9a;
  --s1:#c7a0e6; --s2:#8fb5e6; --s3:#efa6d0; --s4:#8fd1a4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:13px;color:var(--dim);font-weight:600;margin:22px 0 10px;letter-spacing:.02em}
.sub{color:var(--dim);font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--dim);white-space:nowrap}
.pill.amber{background:var(--amber-d);color:var(--amber)}
.pill.green{background:var(--green-d);color:var(--green)}
.btn{appearance:none;white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card2);color:var(--text);
  border-radius:10px;padding:9px 13px;font:inherit;font-size:14px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);color:#1b1024;border-color:var(--amber);font-weight:700}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.block{width:100%}
input[type=number],input[type=text],input[type=password],textarea,select{
  background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:9px;
  padding:8px 10px;font:inherit;font-size:15px;width:100%}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px}
.bar{height:6px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--amber);border-radius:99px;transition:width .3s}
.bar.green>i{background:var(--green)}
.title{font-weight:700;font-size:16px;letter-spacing:-.01em}
.author{color:var(--faint);font-size:12px}
.tip{font-size:13px;color:var(--dim);margin-top:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--amber);margin:1px 0 0;flex:none}
.check.done span{color:var(--faint);text-decoration:line-through}
.hero{background:linear-gradient(135deg,#231a2e,#121114 70%);border:1px solid #4b3a5e;border-radius:18px;padding:16px;margin:14px 0 6px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:#00000033;border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:18px}
.stat small{color:var(--dim);font-size:11px}
.week{display:flex;gap:5px;margin-top:12px}
.week div{flex:1;text-align:center;font-size:10px;color:var(--faint)}
.week i{display:block;height:22px;border-radius:6px;background:var(--card2);margin-bottom:3px}
.week i.on{background:var(--amber)}
.week i.today{outline:1.5px solid var(--amber);outline-offset:1px}
.stage-h{display:flex;align-items:center;gap:8px;margin:24px 0 10px}
.stage-h .dot{width:9px;height:9px;border-radius:50%}
.stage-h b{font-size:15px}
.stage-h span{color:var(--dim);font-size:12px}
.bookhead{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.bookhead .l{min-width:0}
.detail{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;display:none}
.card.open .detail{display:block}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--dim);font:inherit;font-size:13px;padding:6px 4px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--text);font-weight:700}
.lbl{font-size:12px;color:var(--dim);margin:12px 0 5px}
.quick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;background:#000000ee;backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:10}
.nav .in{display:flex;max-width:560px;width:100%}
.nav a{flex:1;text-align:center;color:var(--faint);text-decoration:none;font-size:11px;padding:4px 0}
.nav a .ic{display:block;font-size:20px;line-height:1.3;filter:grayscale(1);opacity:.6}
.nav a.on{color:var(--amber)}
.nav a.on .ic{filter:none;opacity:1}
.banner{background:var(--amber-d);border:1px solid #c7a0e655;color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap;word-break:break-all;
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--text)}
.widgetprev{background:#121114;border-radius:22px;padding:16px 18px;font-size:14px;line-height:1.6;white-space:pre-wrap;border:1px solid #2a2a2a}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#ecdff7;color:#1b1024;
  padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px}
.syncdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--faint);margin-right:5px;vertical-align:1px}
.syncdot.ok{background:var(--green)} .syncdot.err{background:var(--red)} .syncdot.busy{background:var(--amber)}
.hide{display:none!important}
.note-item{border-left:3px solid var(--amber);padding:2px 0 2px 10px;margin:6px 0;font-size:14px}
.sw{background:#00000055;border:1px solid #4b3a5e;border-radius:14px;padding:14px;margin-top:14px;text-align:center}
.sw .clock{font-size:46px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 10px}
.sw.run{border-color:var(--amber);box-shadow:0 0 0 3px #c7a0e622}
.sw.run .clock{color:var(--amber)}
.sw .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.sw .btn.big{font-size:17px;padding:13px 0;width:100%}
.sw .btn.stop{background:var(--red);border-color:var(--red);color:#1b1024;font-weight:700}
.sess{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sess:last-child{border-bottom:0}
.sess .n{color:var(--amber);font-weight:700;margin-right:8px}
.sess .t{color:var(--dim);font-size:12.5px}
.del{border:0;background:transparent;color:var(--faint);font-size:17px;padding:4px 8px;cursor:pointer}
.del:active{color:var(--red)}
.celebrate{text-align:center;padding:10px 0 4px}
.celebrate .fl{font-size:72px;line-height:1;display:inline-block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.celebrate .n{font-size:44px;font-weight:900;color:#ffb020;letter-spacing:-.03em;margin-top:4px}
.celebrate .dots{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
.celebrate .dots span{width:30px;text-align:center;font-size:10px;color:var(--faint)}
.celebrate .dots i{display:block;width:26px;height:26px;margin:0 auto 3px;border-radius:50%;background:var(--card2);line-height:26px;font-style:normal;font-size:13px}
.celebrate .dots i.on{background:#ff9600;color:#fff}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:scale(1);opacity:1}}
.ask{display:flex;align-items:center;gap:10px;background:#ff96001a;border:1px solid #ff960055;border-radius:12px;padding:10px 12px;margin-top:12px;font-size:14px}
.ask b{color:#ffb020}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal-head b{font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;color:var(--faint);text-align:center;padding-bottom:2px}
.cal .dow.sun{color:var(--red)} .cal .dow.sat{color:var(--s2)}
.cal button{aspect-ratio:1;border:0;border-radius:10px;background:var(--card);color:var(--dim);font:inherit;font-size:13px;
  position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.cal button.blank{visibility:hidden}
.cal button.l1{background:#c7a0e62e;color:var(--text)} .cal button.l2{background:#c7a0e666;color:var(--text)}
.cal button.l3{background:#c7a0e6aa;color:#1b1024} .cal button.l4{background:var(--amber);color:#1b1024;font-weight:700}
.cal button.today{outline:1.5px solid var(--text);outline-offset:-1.5px}
.cal button.future{opacity:.45}
.cal button small{font-size:9px;line-height:1;opacity:.85}
.cal button.exam{outline:2px solid var(--red);outline-offset:-2px}
.cal button.exam::after{content:'시험';position:absolute;top:2px;right:3px;font-size:8px;color:var(--red);font-weight:700}
.legend{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;color:var(--faint);margin-top:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dday{font-weight:800;color:var(--red)}
.empty{color:var(--faint);font-size:13px;text-align:center;padding:18px 0}
a.link{color:var(--amber)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<nav class="nav"><div class="in">
  <a href="#today" data-v="today"><span class="ic">📖</span>오늘</a>
  <a href="#shelf" data-v="shelf"><span class="ic">📚</span>책장</a>
  <a href="#cal" data-v="cal"><span class="ic">📅</span>달력</a>
  <a href="#notes" data-v="notes"><span class="ic">📝</span>메모</a>
  <a href="#settings" data-v="settings"><span class="ic">⚙️</span>설정</a>
</div></nav>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   독서 체크리스트 — 단일 파일 PWA
   데이터: localStorage (+ 선택: GitHub data 브랜치 동기화 → KWGT 위젯)
   ========================================================= */

const STAGES = [
  {n:1, name:'매매 규율 + 매크로 기초', desc:'가장 먼저 · 시험공부와 병행', color:'var(--s1)'},
  {n:2, name:'투자 철학', desc:'정독 구간', color:'var(--s2)'},
  {n:3, name:'원칙 · 기법', desc:'발췌독 · 필요할 때 찾아보기', color:'var(--s3)'},
  {n:4, name:'틈새 읽기', desc:'출퇴근 · 자기 전', color:'var(--s4)'},
];

// role: heavy(무거운 핵심) / light(가벼운 병행) / daily(매일 조금씩) / ref(발췌·참고)
// unit: page(쪽수) / q(문항) / task(하위 항목만)
// note: rules(내 매매 규칙에 추가할 것 3개) / action(실천할 것 1개)
const BOOKS = [
  {id:'douglas', title:'심리투자 불변의 법칙', short:'심리투자', author:'마크 더글라스', stage:1, role:'heavy', unit:'page', note:'rules',
   tip:'레버리지 단기매매의 손절 기준, 과정과 결과를 나누는 복기 습관과 바로 연결돼요. 1순위.'},
  {id:'q300', title:'경제기사 궁금증 300문 300답', short:'300문', author:'곽해선', stage:1, role:'daily', unit:'q', total:300, note:'rules',
   tip:'하루 몇 문항씩. 읽은 날은 경제기사 하나를 방금 배운 개념으로 해석해 보세요. 투운사 투자분석(거시경제)과도 겹쳐요.',
   tasks:['금리','환율','물가','채권']},
  {id:'housel', title:'돈의 심리학', short:'돈의 심리학', author:'모건 하우절', stage:2, role:'light', unit:'page', note:'rules',
   tip:'가볍게 읽혀요. 하워드 막스 전에 워밍업으로.'},
  {id:'marks', title:'하워드 막스 투자와 마켓사이클의 법칙', short:'마켓사이클', author:'하워드 막스', stage:2, role:'heavy', unit:'page', note:'rules',
   tip:'매크로 맥락을 보는 핵심서. 300문 300답의 금리·채권 파트를 끝내고 읽으면 금리와 신용 사이클 이야기가 훨씬 잘 들어와요.'},
  {id:'dalio', title:'원칙 (PRINCIPLES)', short:'원칙', author:'레이 달리오', stage:3, role:'ref', unit:'task', note:'rules',
   tip:'다 읽을 필요 없어요. 1부만 읽고, 2부는 AI 컴퍼니 사규 설계용 참고서로.',
   tasks:['1부 · 삶의 원칙','2부 · 일의 원칙 — AI 컴퍼니 사규·워크플로우 설계 참고']},
  {id:'bollinger', title:'볼린저 밴드 투자기법', short:'볼린저', author:'존 볼린저', stage:3, role:'ref', unit:'task', note:'rules',
   tip:'정독 말고 필요한 장만. 지금 RSI에 볼린저를 얹어 쓰고 있어서 바로 연결돼요.',
   tasks:['%b','밴드폭(BandWidth)','다른 지표와 조합하는 법','읽은 내용 Pine Script로 검증']},
  {id:'harmonic', title:'하모닉 이론', short:'하모닉', author:'하모린', stage:3, role:'ref', unit:'task', note:'rules',
   tip:'우선순위 가장 낮음. 백테스트로 확인되기 전에는 실전에 쓰지 않기.',
   tasks:['피보나치 채널 작도와 겹치는 부분','패턴 하나 골라 Pine Script 백테스트']},
  {id:'reverser', title:'역행자', short:'역행자', author:'자청', stage:4, role:'light', unit:'page', note:'action', tip:'틈새 읽기 1번.'},
  {id:'income', title:'소득혁명', short:'소득혁명', author:'브라이언 페이지', stage:4, role:'light', unit:'page', note:'action', tip:'틈새 읽기 2번.'},
  {id:'doubleclick', title:'더블 클릭', short:'더블 클릭', author:'알간지', stage:4, role:'light', unit:'page', note:'action', tip:'틈새 읽기 3번.'},
  {id:'caveman', title:'완벽한 원시인', short:'원시인', author:'자청', stage:4, role:'light', unit:'page', note:'action',
   tip:'역행자와 같은 저자라 메시지가 겹쳐요. 훑어보기만 해도 충분.'},
  {id:'dark', title:'다크 심리학', short:'다크 심리학', author:'다크 사이드 프로젝트', stage:4, role:'light', unit:'page', note:'action',
   tip:'투자와 직접 관련이 적어 맨 뒤로.'},
];
const ROLE = {heavy:'핵심 정독', light:'가볍게', daily:'매일 조금씩', ref:'발췌독'};
const STATUS = {todo:'대기', reading:'읽는 중', done:'완독', skip:'건너뜀'};

/* ---------- storage ---------- */
const KEY = 'reading-tracker-v1';
const today = () => ymd(new Date());
function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function defaultState(){
  const books = {};
  BOOKS.forEach(b=>books[b.id]={status:'todo',cur:0,total:b.total||null,tasks:{},notes:['','',''],startedAt:null,doneAt:null});
  books.douglas.status='reading'; books.q300.status='reading';
  books.douglas.startedAt = books.q300.startedAt = today();
  return {v:1, books, log:{}, settings:{examMode:true, examDate:'', dailyMin:30, qPerDay:10,
    sync:{owner:'jinhj423',repo:'reading-tracker',branch:'data',token:'',backup:false}}, updatedAt:Date.now()};
}
let S;
function load(){
  try{ S = JSON.parse(localStorage.getItem(KEY)) }catch(e){ S = null }
  if(!S || !S.books) S = defaultState();
  // 새 책이 추가된 경우 보정
  BOOKS.forEach(b=>{ if(!S.books[b.id]) S.books[b.id]={status:'todo',cur:0,total:b.total||null,tasks:{},notes:['','',''],startedAt:null,doneAt:null} });
}
let _doneToday = null;
function save(silent){
  S.updatedAt = Date.now();
  const doneNow = !!S.log[today()];
  if(_doneToday===false && doneNow) setTimeout(celebrate, 60);   // 오늘 첫 기록 → 듀오링고식 축하
  _doneToday = doneNow;
  try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){}
  pushNative();
  scheduleSync();
  if(!silent) render();
}

/* ---------- derived ---------- */
const B = id => BOOKS.find(b=>b.id===id);
function pct(b){
  const s=S.books[b.id];
  if(s.status==='done') return 100;
  if(b.unit==='task'){ const n=(b.tasks||[]).length; return n? Math.round(100*Object.values(s.tasks).filter(Boolean).length/n):0 }
  if(!s.total) return 0;
  return Math.min(100, Math.round(100*s.cur/s.total));
}
function streak(){
  let d=new Date(), n=0;
  if(!S.log[ymd(d)]) d.setDate(d.getDate()-1);         // 오늘 아직이면 어제부터 셈
  while(S.log[ymd(d)]){ n++; d.setDate(d.getDate()-1) }
  return n;
}
function streakAt(day){ let d=new Date(day+'T12:00:00'), n=0; while(S.log[ymd(d)]){ n++; d.setDate(d.getDate()-1) } return n }
function lastDay(){ const k=Object.keys(S.log).sort(); return k[k.length-1]||'' }
function celebrate(){
  const st=streak(); const days=['일','월','화','수','목','금','토']; let dots='';
  for(let i=6;i>=0;i--){ const x=new Date(); x.setDate(x.getDate()-i); dots+=`<span><i class="${S.log[ymd(x)]?'on':''}">${S.log[ymd(x)]?'✓':''}</i>${days[x.getDay()]}</span>` }
  const msg = st===1?'오늘부터 다시 시작!': st%7===0?`${st/7}주 연속 달성! 대단해요`: st>=3?'불꽃이 이어지고 있어요':'좋아요, 내일도 이어가요';
  sheet(`<div class="celebrate"><div class="fl">🔥</div><div class="n">${st}일 연속</div><div class="sub">${msg}</div>
    <div class="dots">${dots}</div></div>
    <button class="btn block primary" style="margin-top:10px" onclick="closeSheet()">계속</button>`);
}
function reading(){ return BOOKS.filter(b=>S.books[b.id].status==='reading') }
function nextUp(){
  const maxStage = S.settings.examMode ? 1 : 4;
  return BOOKS.find(b=>S.books[b.id].status==='todo' && b.stage<=maxStage) || null;
}
function counts(){
  const active = BOOKS.filter(b=>S.books[b.id].status!=='skip');
  return {done:active.filter(b=>S.books[b.id].status==='done').length, n:active.length};
}
function totalMin(){ return Object.values(S.log).reduce((a,l)=>a+(l.min||0),0) }
function addItem(id,n){
  const t=today(); const l=S.log[t]||{min:0}; l.items=l.items||{};
  l.items[id]=Math.max(0,(l.items[id]||0)+n); if(!l.items[id]) delete l.items[id]; S.log[t]=l;
}
function dday(){
  const e=S.settings.examDate; if(!e) return null;
  const a=new Date(today()+'T00:00:00'), b=new Date(e+'T00:00:00');
  return Math.round((b-a)/86400000);
}
const ddayTxt = n => n===null?'':n>0?`D-${n}`:n===0?'D-DAY':`D+${-n}`;
function markRead(min){
  const t=today(); const l=S.log[t]||{min:0};
  l.min = (l.min||0) + (min||0); S.log[t]=l;
}

/* ---------- widget text (KWGT가 읽는 내용) ---------- */
function widgetText(){
  // 위젯 텍스트는 앱을 연 시점에만 갱신되므로 '오늘' 대신 마지막 기록 날짜를 보여줌
  const lines=[];
  const days=Object.keys(S.log).sort(); const last=days[days.length-1];
  const lastTxt = S.timer ? '⏱ 읽는 중' : last ? (last===today()?`오늘 ${S.log[last].min||0}분 ✓`:`마지막 ${+last.slice(5,7)}/${+last.slice(8,10)}`) : '기록 없음';
  const dd=dday(); lines.push(`🔥 ${streak()}일 연속 · ${lastTxt}${dd!==null&&dd>=0?' · 투운사 '+ddayTxt(dd):''}`);
  const r = reading();
  r.slice(0,3).forEach(b=>{
    const s=S.books[b.id];
    if(b.unit==='q'){
      const a=s.cur+1, z=Math.min(b.total, s.cur+S.settings.qPerDay);
      lines.push(s.cur>=b.total ? `📰 ${b.short} 완료` : `📰 ${b.short} Q${a}–${z} (${s.cur}/${b.total})`);
    }else if(b.unit==='task'){
      const left=(b.tasks||[]).find((x,i)=>!s.tasks[i]);
      lines.push(`🔖 ${b.short} ${pct(b)}%${left?' → '+left.split(' — ')[0]:''}`);
    }else{
      lines.push(`📖 ${b.short} ${s.total? pct(b)+'% (p.'+s.cur+')' : 'p.'+s.cur}`);
    }
  });
  if(!r.length){ const n=nextUp(); lines.push(n?`다음 책: ${n.title}`:'다음 책을 골라주세요'); }
  const c=counts();
  lines.push(`✅ ${c.done}/${c.n}권${S.settings.examMode?' · 시험 모드':''}`);
  return lines.join('\n');
}

function notesMarkdown(){
  const out=['# 독서 메모 — 내 매매 규칙 & 실천','', `_${today()} 내보냄_`,''];
  BOOKS.forEach(b=>{
    const ns=S.books[b.id].notes.filter(x=>x&&x.trim());
    if(!ns.length) return;
    out.push(`## ${b.title} — ${b.author}`);
    out.push(b.note==='rules'?'**매매 규칙에 추가할 것**':'**실천할 것**');
    ns.forEach(x=>out.push(`- [ ] ${x.trim()}`));
    out.push('');
  });
  return out.join('\n');
}

/* ---------- calendar ---------- */
let calY=new Date().getFullYear(), calM=new Date().getMonth();
function level(l){ if(!l) return 0; const m=l.min||0; if(m>=60) return 4; if(m>=30) return 3; if(m>=15) return 2; return 1; }
function itemsTxt(items){
  return Object.entries(items||{}).map(([id,n])=>{ const b=B(id); if(!b) return ''; return `${b.short} ${b.unit==='q'?'+'+n+'문항':'+'+n+'쪽'}` }).filter(Boolean);
}
function calMove(d){ calM+=d; if(calM<0){calM=11;calY--} if(calM>11){calM=0;calY++} render() }
function vCal(){
  const first=new Date(calY,calM,1), lastDay=new Date(calY,calM+1,0).getDate(), t=today();
  const z=n=>String(n).padStart(2,'0');
  let cells=['일','월','화','수','목','금','토'].map((x,i)=>`<div class="dow ${i===0?'sun':i===6?'sat':''}">${x}</div>`).join('');
  for(let i=0;i<first.getDay();i++) cells+='<button class="blank" tabindex="-1"></button>';
  let mDays=0, mMin=0, mPages=0, mQ=0, best=0, run=0;
  for(let d=1; d<=lastDay; d++){
    const k=`${calY}-${z(calM+1)}-${z(d)}`, l=S.log[k], lv=level(l);
    if(l){ mDays++; mMin+=l.min||0; Object.entries(l.items||{}).forEach(([id,n])=>{ const b=B(id); if(b&&b.unit==='q') mQ+=n; else mPages+=n }); run++; best=Math.max(best,run) } else if(k<=t) run=0;
    const cls=[lv?'l'+lv:'', k===t?'today':'', k>t?'future':'', k===S.settings.examDate?'exam':''].join(' ');
    const sub = l ? (l.min? l.min+'분' : '✓') : '';
    cells+=`<button class="${cls}" onclick="daySheet('${k}')">${d}${sub?`<small>${sub}</small>`:''}</button>`;
  }
  const dd=dday();
  return `<h1>달력</h1><div class="sub">날짜를 누르면 그날 기록을 보거나 채울 수 있어요</div>
  <div class="card" style="margin-top:14px">
    <div class="cal-head"><button class="btn sm ghost" onclick="calMove(-1)">‹</button><b>${calY}년 ${calM+1}월</b><button class="btn sm ghost" onclick="calMove(1)">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend">적게 <i style="background:var(--card)"></i><i style="background:#c7a0e62e"></i><i style="background:#c7a0e666"></i><i style="background:#c7a0e6aa"></i><i style="background:var(--amber)"></i> 60분+</div>
  </div>
  <div class="stats" style="margin-top:4px">
    <div class="stat"><b>${mDays}일</b><small>읽은 날</small></div>
    <div class="stat"><b>${Math.round(mMin/6)/10}h</b><small>독서 시간</small></div>
    <div class="stat"><b>${best}일</b><small>최장 연속</small></div>
  </div>
  <div class="stats" style="grid-template-columns:repeat(2,1fr)">
    <div class="stat"><b>${mPages}쪽</b><small>읽은 쪽수</small></div>
    <div class="stat"><b>${mQ}문항</b><small>300문 300답</small></div>
  </div>
  ${dd!==null?`<div class="banner" style="margin-top:12px">📌 투운사 시험 <b>${S.settings.examDate}</b> · <span class="dday">${ddayTxt(dd)}</span></div>`
    :`<div class="banner" style="margin-top:12px">📌 설정에서 투운사 시험일을 넣으면 달력에 표시돼요</div>`}`;
}
function daySheet(k){
  const l=S.log[k]; const its=itemsTxt(l&&l.items); const future=k>today();
  const [y,m,d]=k.split('-').map(Number);
  sheet(`<div class="title">${y}년 ${m}월 ${d}일${k===S.settings.examDate?' · <span class="dday">시험일</span>':''}</div>
    ${its.length?`<div class="tip">${its.map(esc).join(' · ')}</div>`:`<div class="tip">${l?'시간만 기록된 날':'기록 없음'}</div>`}
    ${l&&(l.sessions||[]).length?`<div class="lbl">회차</div>${sessionsHTML(k)}`:''}
    ${future?'':`<div class="lbl">그날 총 독서 시간(분) — 기록을 깜빡한 날도 여기서 채울 수 있어요</div>
    <input type="number" inputmode="numeric" id="dayMin" value="${l?l.min||0:S.settings.dailyMin}">
    <div class="quick"><button class="btn primary" onclick="saveDay('${k}')">저장</button>
    ${l?`<button class="btn" style="color:var(--red)" onclick="delDayAsk('${k}')">기록 지우기</button>`:''}
    <button class="btn ghost" onclick="closeSheet()">닫기</button></div>`}
    ${future?`<div class="quick"><button class="btn ghost" onclick="closeSheet()">닫기</button></div>`:''}`);
}
function saveDay(k){ const l=S.log[k]||{min:0}; l.min=Math.max(0,+$('#dayMin').value||0); S.log[k]=l; closeSheet(); save(); toast('저장했어요') }

/* ---------- stopwatch ---------- */
const hm = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') };
function fmtClock(ms){ const t=Math.max(0,Math.floor(ms/1000)), h=Math.floor(t/3600), m=Math.floor(t%3600/60), x=t%60, z=n=>String(n).padStart(2,'0');
  return h? `${h}:${z(m)}:${z(x)}` : `${z(m)}:${z(x)}` }
function startTimer(){
  if(S.timer) return;
  S.timer={start:Date.now()}; save();
  const n=((S.log[today()]||{}).sessions||[]).length+1;
  toast(`▶ ${n}회차 시작`);
}
function stopTimer(){
  if(!S.timer) return;
  const st=S.timer.start, end=Date.now(), min=Math.round((end-st)/60000);
  if(min<1){ S.timer=null; save(); toast('1분 미만이라 기록하지 않았어요'); return }
  if(min>180){   // 종료를 깜빡한 경우
    sheet(`<div class="title">${Math.floor(min/60)}시간 ${min%60}분이 지났어요</div>
      <div class="tip">${hm(st)}에 시작했어요. 종료를 깜빡했다면 실제로 읽은 시간으로 고쳐주세요.</div>
      <div class="lbl">실제 읽은 시간(분)</div><input type="number" inputmode="numeric" id="fixMin" value="${min}">
      <div class="quick"><button class="btn primary" onclick="const m=Math.max(1,+$('#fixMin').value||1);commitSession(${st},${st}+m*60000,m);closeSheet()">기록</button>
      <button class="btn" style="color:var(--red)" onclick="S.timer=null;closeSheet();save();toast('이번 회차는 버렸어요')">버리기</button></div>`);
    return;
  }
  commitSession(st,end,min);
}
function commitSession(st,end,min){
  const day=ymd(new Date(st)); const first=!S.log[today()]; const l=S.log[day]||{min:0};
  l.sessions=l.sessions||[]; l.sessions.push({s:st,e:end,min});
  l.min=(l.min||0)+min; S.log[day]=l; S.timer=null; save();
  if(!(first && day===today())) toast(`■ ${l.sessions.length}회차 ${min}분 · 오늘 합계 ${l.min}분`);
}
function delSessionAsk(day,i){
  const l=S.log[day]; const x=l&&l.sessions&&l.sessions[i]; if(!x) return;
  sheet(`<div class="title">${i+1}회차 기록을 지울까요?</div>
    <div class="tip">${day.slice(5).replace('-','/')} ${hm(x.s)}–${hm(x.e)} · ${x.min}분. 그날 합계에서도 빠져요.</div>
    <div class="quick"><button class="btn" style="color:var(--red)" onclick="delSession('${day}',${i})">지우기</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}
function delSession(day,i){
  const l=S.log[day]; const x=l.sessions.splice(i,1)[0];
  l.min=Math.max(0,(l.min||0)-x.min);
  if(!l.min && !l.sessions.length && !Object.keys(l.items||{}).length) delete S.log[day];
  closeSheet(); save(); toast('지웠어요');
}
function delDayAsk(day){
  sheet(`<div class="title">${day.slice(5).replace('-','/')} 기록을 전부 지울까요?</div>
    <div class="tip">독서 시간, 회차, 그날 기록한 쪽수·문항 내역이 지워져요. (책 진도 자체는 그대로예요)</div>
    <div class="quick"><button class="btn" style="color:var(--red)" onclick="delete S.log['${day}'];closeSheet();save();toast('지웠어요')">전부 지우기</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}
function sessionsHTML(day){
  const ss=((S.log[day]||{}).sessions)||[];
  if(!ss.length) return '';
  return ss.map((x,i)=>`<div class="sess"><div><span class="n">${i+1}회</span>${x.min}분 <span class="t">${hm(x.s)}–${hm(x.e)}</span></div>
    <button class="del" aria-label="삭제" onclick="delSessionAsk('${day}',${i})">🗑</button></div>`).join('');
}
function swHTML(){
  const l=S.log[today()]||{}; const n=(l.sessions||[]).length; const run=!!S.timer;
  return `<div class="sw ${run?'run':''}">
    <div class="sub">${run?`<span class="live"></span>${n+1}회차 읽는 중 · ${hm(S.timer.start)} 시작`:(n?`오늘 ${n}회 · 합계 ${l.min||0}분`:`오늘 목표 ${S.settings.dailyMin}분`)}</div>
    <div class="clock" id="clock">${run?fmtClock(Date.now()-S.timer.start):fmtClock((l.min||0)*60000)}</div>
    ${run?`<button class="btn big stop" onclick="stopTimer()">■ 종료</button>`
         :`<button class="btn big primary" onclick="startTimer()">▶ ${n?'이어서 읽기':'독서 시작'}</button>`}
    <div class="row" style="justify-content:center;gap:4px;margin-top:6px">
      <button class="btn sm ghost" onclick="logSheet()">시간 직접 입력</button>
    </div>
  </div>`;
}
setInterval(()=>{ const c=document.getElementById('clock'); if(c && S.timer) c.textContent=fmtClock(Date.now()-S.timer.start) },1000);

/* ---------- actions ---------- */
function toggleOpen(id){ open.has(id)?open.delete(id):open.add(id); const el=$('#card-'+id); if(el) el.classList.toggle('open') }
function openBook(id){ open.add(id); location.hash='shelf'; setTimeout(()=>{const el=$('#card-'+id); el&&el.scrollIntoView({behavior:'smooth',block:'start'})},60) }
function setStatus(id,st){
  const s=S.books[id]; s.status=st;
  if(st==='reading'&&!s.startedAt) s.startedAt=today();
  if(st==='done'){ s.doneAt=today(); toast(`🎉 ${B(id).short} 완독! 메모 3개 남겨볼까요?`) }
  save();
}
function startBook(id){ setStatus(id,'reading'); toast(`${B(id).short} 시작`) }
function finish(id){
  const b=B(id);
  sheet(`<div class="title">${esc(b.title)} 완독 처리할까요?</div>
    <div class="tip">완독 후 ${b.note==='rules'?'내 매매 규칙에 추가할 것 3개':'실천할 것 1개'}를 적어두면 메모 탭에 모여요.</div>
    <div class="quick"><button class="btn primary" onclick="closeSheet();S.books['${id}'].cur=S.books['${id}'].total||S.books['${id}'].cur;setStatus('${id}','done');openBook('${id}')">완독 + 메모 쓰기</button>
    <button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}
function setTotal(id){ const v=+$('#tot-'+id).value; if(v>0){ S.books[id].total=v; save(); } }
function setPage(id){
  const el=$('#pg-'+id); const v=+el.value; const s=S.books[id];
  if(!(v>=0)) return;
  const delta=v-s.cur; s.cur=Math.min(v, s.total||v);
  if(delta!==0) addItem(id, delta);
  if(s.total && s.cur>=s.total){ save(); finish(id); return }
  save(); toast(delta>0?`+${delta}쪽 기록`:'수정했어요');
}
function addQ(id,n){
  const s=S.books[id]; const b=B(id);
  const before=s.cur; s.cur=Math.max(0,Math.min(b.total,s.cur+n));
  if(s.cur!==before) addItem(id, s.cur-before);
  if(s.cur>=b.total){ save(); finish(id); return }
  save(); if(n>0) toast(`Q${s.cur}까지`);
}
function toggleTask(id,i){ const s=S.books[id]; s.tasks[i]=!s.tasks[i]; save() }
function setNote(id,i,v){ S.books[id].notes[i]=v; save(true) }
function quickLog(){ markRead(S.settings.dailyMin); save() }
function logSheet(){
  const l=S.log[today()]||{min:0};
  sheet(`<div class="title">오늘 총 독서 시간 수정</div><div class="tip">스톱워치를 안 켜고 읽은 날에 써요. 입력한 값이 오늘 합계가 돼요.</div><div class="lbl">분</div>
    <input type="number" inputmode="numeric" id="minIn" value="${l.min||0}">
    <div class="quick"><button class="btn primary" onclick="S.log[today()]={...(S.log[today()]||{}),min:+$('#minIn').value||0};closeSheet();save()">저장</button>
    ${S.log[today()]?`<button class="btn" style="color:var(--red)" onclick="delDayAsk(today())">오늘 기록 지우기</button>`:''}
    <button class="btn ghost" onclick="closeSheet()">닫기</button></div>`);
}
function exportJSON(){ const c=JSON.parse(JSON.stringify(S)); c.settings.sync.token=''; return JSON.stringify(c,null,1) }
function importSheet(){
  sheet(`<div class="title">백업 JSON 붙여넣기</div><textarea id="impIn" style="height:180px;margin-top:10px"></textarea>
    <div class="quick"><button class="btn primary" onclick="doImport($('#impIn').value)">복원</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}
function doImport(txt, keepToken=true){
  try{ const x=JSON.parse(txt); if(!x.books) throw 0;
    const tok=S.settings.sync.token; S=x; if(keepToken) S.settings.sync.token=tok||S.settings.sync.token||'';
    load2(); closeSheet(); save(); toast('복원했어요') }
  catch(e){ toast('JSON 형식이 맞지 않아요') }
}
function load2(){ const t=S; localStorage.setItem(KEY,JSON.stringify(t)); load(); }
function resetSheet(){
  sheet(`<div class="title">모든 기록을 지울까요?</div><div class="tip">되돌릴 수 없어요. 먼저 JSON 복사로 백업해 두세요.</div>
    <div class="quick"><button class="btn" style="color:var(--red)" onclick="const tok=S.settings.sync.token;S=defaultState();S.settings.sync.token=tok;closeSheet();save()">초기화</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}

/* ---------- GitHub sync ---------- */
let syncState={cls:'',msg:'동기화 꺼짐 (토큰 없음)'}; let syncTimer=null;
function syncLabel(){ const sy=S.settings.sync; if(!sy.token) return '로컬 저장'; return `<span class="syncdot ${syncState.cls}"></span>${syncState.cls==='ok'?'위젯 연동됨':syncState.cls==='err'?'동기화 오류':'동기화 중'}` }
function setSync(cls,msg){ syncState={cls,msg}; const p=$('#syncpill'); if(p) p.innerHTML=syncLabel() }
function scheduleSync(){ if(!S.settings.sync.token) return; clearTimeout(syncTimer); setSync('busy','변경 사항 올리는 중…'); syncTimer=setTimeout(()=>syncNow(false),3000) }
const b64e = s => btoa(unescape(encodeURIComponent(s)));
const b64d = s => decodeURIComponent(escape(atob(s.replace(/\s/g,''))));
async function gh(path, opt={}){
  const sy=S.settings.sync;
  const r = await fetch(`https://api.github.com/repos/${sy.owner}/${sy.repo}${path}`, {...opt,
    headers:{'Authorization':`Bearer ${sy.token}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===404) return null;
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,120)) }
  return r.json();
}
async function ensureBranch(){
  const br=S.settings.sync.branch||'data';
  if(await gh(`/git/ref/heads/${br}`)) return;
  const repo=await gh(''); if(!repo) throw new Error('저장소를 찾을 수 없어요');
  const base=await gh(`/git/ref/heads/${repo.default_branch}`);
  if(!base) throw new Error('저장소가 비어 있어요. README 하나라도 먼저 커밋해 주세요');
  await gh('/git/refs',{method:'POST',body:JSON.stringify({ref:`refs/heads/${br}`,sha:base.object.sha})});
}
async function putFile(path, content){
  const br=S.settings.sync.branch||'data';
  const cur=await gh(`/contents/${path}?ref=${br}`);
  if(cur && cur.content && b64d(cur.content)===content) return false;
  await gh(`/contents/${path}`,{method:'PUT',body:JSON.stringify({message:`update ${path}`,content:b64e(content),branch:br,...(cur?{sha:cur.sha}:{})})});
  return true;
}
async function syncNow(manual){
  const sy=S.settings.sync;
  if(!sy.token||!sy.owner||!sy.repo){ if(manual) toast('owner/repo/토큰을 먼저 입력해 주세요'); return }
  setSync('busy','올리는 중…');
  try{
    await ensureBranch();
    await putFile('widget.txt', widgetText()+'\n');
    if(sy.backup) await putFile('state.json', exportJSON());
    const t=new Date(); setSync('ok',`동기화 완료 ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`);
    if(manual) toast('위젯 데이터 올렸어요');
  }catch(e){
    const m = String(e.message||e).includes('Failed to fetch') ? '네트워크 차단 (설치된 앱에서 실행해 주세요)' : String(e.message||e);
    setSync('err',m); if(manual) toast('동기화 실패');
  }
  if(view==='settings') render();
}
function pullSheet(){
  sheet(`<div class="title">GitHub의 state.json으로 덮어쓸까요?</div><div class="tip">'전체 백업' 옵션으로 올린 기록이 있어야 해요. 이 기기 기록은 대체돼요.</div>
    <div class="quick"><button class="btn primary" onclick="pullNow()">불러오기</button><button class="btn ghost" onclick="closeSheet()">취소</button></div>`);
}
async function pullNow(){
  try{ const f=await gh(`/contents/state.json?ref=${S.settings.sync.branch||'data'}`);
    if(!f){ toast('state.json이 없어요'); return } doImport(b64d(f.content)) }
  catch(e){ toast('불러오기 실패'); }
}
/* 날짜가 바뀌면 위젯의 '오늘' 줄을 갱신하기 위해 앱을 열 때마다 1회 동기화 */
function syncOnOpen(){ if(S.settings.sync.token) syncNow(false) }

/* ---------- 안드로이드 앱 위젯 브리지 ---------- */
const IN_APP = !!window.AndroidWidget;
function pushNative(){
  if(!window.AndroidWidget) return;
  try{
    const lines=widgetText().split('\n');
    AndroidWidget.update(JSON.stringify({
      day: today(), header: lines[0], headerStale: '🔥 오늘 아직 안 읽었어요',
      body: lines.slice(1).join('\n'), timerStart: S.timer? S.timer.start : 0,
      todayMin: (S.log[today()]||{}).min||0,
      lastDay: lastDay(), streakAtLast: lastDay()? streakAt(lastDay()) : 0
    }));
  }catch(e){}
}
function setRem(){ try{ if(window.AndroidWidget && AndroidWidget.setReminder) AndroidWidget.setReminder(S.settings.remindHour ?? 21) }catch(e){} }
// 위젯 버튼에서 호출: start / stop / '' (앱 복귀 시 갱신)
window.nativeAction = function(a){
  if(a==='start'||a==='stop'){ if(location.hash!=='#today') location.hash='today'; }
  if(a==='start') startTimer(); else if(a==='stop') stopTimer(); else { render(); pushNative(); }
};

/* ---------- boot ---------- */
load(); _doneToday=!!S.log[today()]; route(); syncOnOpen(); pushNative(); setRem();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ _doneToday=!!S.log[today()]; render(); syncOnOpen() } });
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}) }catch(e){} }
</script>
</body>
